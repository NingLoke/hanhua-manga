<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">

<title>一键汉化漫画 4.0.5</title>
<script>
  // 首帧前确定主题，避免白屏闪烁（?theme= 优先，其次上次记住的主题，最后跟随系统）
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), t = q;
    try { t = t || localStorage.getItem("hanhua.theme"); } catch (e) {}
    if (!t || t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (new URLSearchParams(location.search).has("shot")) document.documentElement.classList.add("no-anim");
  })();
</script>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo"><use href="#i-logo"/></svg>
      <span class="brand-name">一键汉化漫画</span>
      <span class="brand-ver">4.0.5</span>
      <span class="demo-badge" id="demoBadge" hidden>演示模式</span>
    </div>
    <div class="topbar-right">
      <button class="hw-chip" id="hwChip" data-tip="硬件加速" data-act="go-about">
        <span class="hw-dot"></span><svg class="ico"><use href="#i-chip"/></svg><span id="hwChipText">正在识别硬件…</span>
      </button>
      <div class="seg seg-sm" id="profileSeg" role="radiogroup" aria-label="画质档位">
        <button data-v="fast" data-tip="最快：小模型 + 较低修复分辨率"><svg class="ico"><use href="#i-bolt"/></svg>极速</button>
        <button data-v="balanced" data-tip="速度与画质兼顾（推荐）"><svg class="ico"><use href="#i-gauge"/></svg>均衡</button>
        <button data-v="quality" data-tip="最好画质：大模型 + 高分辨率修复"><svg class="ico"><use href="#i-sparkle"/></svg>高质量</button>
      </div>
      <button class="btn-icon" id="themeBtn" data-tip="外观：跟随系统"><svg class="ico"><use href="#i-monitor"/></svg></button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <a class="nav-item" href="#/tasks" data-route="tasks"><svg class="ico"><use href="#i-tasks"/></svg><span class="nav-label">任务</span><span class="nav-badge" id="navTaskBadge" hidden>0</span></a>
    <a class="nav-item" href="#/editor" data-route="editor"><svg class="ico"><use href="#i-edit"/></svg><span class="nav-label">校对</span></a>
    <a class="nav-item" href="#/glossary" data-route="glossary"><svg class="ico"><use href="#i-book"/></svg><span class="nav-label">术语表</span><span class="nav-badge muted" id="navGlossBadge" hidden>0</span></a>
    <a class="nav-item" href="#/settings" data-route="settings"><svg class="ico"><use href="#i-sliders"/></svg><span class="nav-label">设置</span></a>
    <a class="nav-item" href="#/about" data-route="about"><svg class="ico"><use href="#i-info"/></svg><span class="nav-label">关于</span></a>
    <div class="side-spacer"></div>
    <div class="engine-card" id="engineCard">
      <div class="engine-row"><span class="engine-dot" id="engineDot"></span><span class="engine-state" id="engineState">空闲</span></div>
      <div class="engine-sub" id="engineSub">拖入漫画即可开始</div>
      <div class="mini-progress"><div class="mini-fill" id="engineFill"></div></div>
      <button class="btn btn-sm btn-block" id="engineToggle" data-act="toggle-engine"><svg class="ico"><use href="#i-pause"/></svg><span>全部暂停</span></button>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="conn-banner" id="connBanner" hidden><span class="spinner sm"></span>与后台的连接已断开，正在重新连接…</div>
    <div class="engine-banner" id="engineBanner" hidden></div>
    <section class="view" data-view="tasks" id="view-tasks"></section>
    <section class="view" data-view="editor" id="view-editor"></section>
    <section class="view" data-view="glossary" id="view-glossary"></section>
    <section class="view" data-view="settings" id="view-settings"></section>
    <section class="view" data-view="about" id="view-about"></section>
  </main>
</div>

<div class="drop-overlay" id="dropOverlay" hidden>
  <div class="drop-overlay-box">
    <div class="drop-overlay-icon"><svg class="ico"><use href="#i-upload"/></svg></div>
    <div class="drop-overlay-title">松开鼠标，开始汉化</div>
    <div class="drop-overlay-sub">支持文件夹、图片、压缩包、PDF、EPUB，可以一次拖入多本</div>
  </div>
</div>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="js-errors" id="jsErrors" hidden></div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="csvInput" accept=".csv,.tsv,.txt" hidden>
<noscript><div class="noscript">界面需要启用 JavaScript 才能运行。</div></noscript>
</body>
</html>
